# ทำคลิปรายวันบน GitHub Actions (ฟรี) — ภาพ 3 มิติใช้เวลานาน จึงตั้งเวลารอไว้ 5.5 ชม. — 06:00 เวลาไทย = 23:00 UTC
name: daily-clips
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "ทำเฉพาะตอนเหล่านี้ (คั่นด้วย ,) เว้นว่าง = ตามคิวปกติ"
        required: false
        default: ""
      date:
        description: "ชื่อโฟลเดอร์ในไดรฟ์ (เว้นว่าง = วันนี้)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: ติดตั้ง
        run: |
          pip install -q -r tools/requirements.txt
          cd tools && npm ci --silent
      - name: ทำคลิป + อัปไดรฟ์
        env:
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          DRIVE_UPLOAD_KEY: ${{ secrets.DRIVE_UPLOAD_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONIOENCODING: utf-8
          ONLY: ${{ github.event.inputs.only }}
          DAY: ${{ github.event.inputs.date }}
        run: python tools/daily_run.py ${ONLY:+--only "$ONLY"} ${DAY:+--date "$DAY"}
      - name: บันทึกว่าลงตอนไหนไปแล้ว
        if: always()
        run: |
          git config user.name "daily-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/registry.json
          git commit -m "บันทึกคลิปที่ลงแล้ว $(TZ=Asia/Bangkok date +%d.%m.%Y)" || true
          git push || true
